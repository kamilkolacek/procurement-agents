[project]
name = "procurement-agents"
version = "0.0.1"
description = "Governed procurement analytics agents (monorepo). Agent #2: Spend Classification & Savings Finder."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["shared/tests", "agents/spend-classification/tests", "tests"]
pythonpath = [".", "agents/spend-classification/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["agents/spend-classification/data", "agents/spend-classification/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*.py" = ["S603", "S607", "UP", "B905"]  # hooks shell out to uv/ruff; must run on py3.9
"scripts/*.py" = ["S603", "S607"]
"tests/**/*.py" = ["S603", "S607"]
"shared/audit/run_manifest.py" = ["S603", "S607"]  # fixed git argv, no user input
