name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Secret and PII scan
        run: uv run python scripts/scan_secrets.py
      - name: Prompt hash check
        run: uv run python -m shared.evals.prompt_manifest --check agents/spend-classification/prompts
      - name: Eval gate
        run: uv run python -m shared.evals.harness --agent spend-classification --mode full
      - name: Golden set unchanged unless declared
        if: github.event_name == 'pull_request'
        env:  # pass untrusted PR text via env, never inline in the script
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD -- 'agents/*/evals/golden/' 'agents/*/evals/reports/baseline.json' 'shared/evals/targets.toml')
          if [ -n "$changed" ] && ! printf '%s' "$PR_BODY" | grep -qi "golden-change-approved"; then
            echo "Protected eval files changed without 'golden-change-approved' in the PR body:"
            echo "$changed"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
