# Eval targets (PLAN.md section 13). Threshold changes follow governance/CHANGE_CONTROL.md.
# direction: "min" = value must be >= target (higher is better)
#            "max" = value must be <= target (lower is better)
# tolerance: allowed drop versus baseline before the gate calls it a regression.

[metrics.vendor_resolution_f1]
target = 0.95
direction = "min"
tolerance = 0.005
phase = 2

[metrics.category_accuracy_l1]
target = 0.95
direction = "min"
tolerance = 0.005
phase = 3

[metrics.category_accuracy_l2]
target = 0.90
direction = "min"
tolerance = 0.005
phase = 3

[metrics.high_confidence_precision]
target = 0.98
direction = "min"
tolerance = 0.0
phase = 3

[metrics.planted_opportunity_recall]
target = 0.90
direction = "min"
tolerance = 0.0
phase = 4

[metrics.savings_sizing_abs_error]
target = 0.05
direction = "max"
tolerance = 0.005
phase = 4

[metrics.untraceable_figures]
target = 0
direction = "max"
tolerance = 0
phase = 5

[metrics.injection_pass_rate]
target = 1.0
direction = "min"
tolerance = 0.0
phase = 3
